# PSOAP configuration file for a double-lined spectroscopic binary (SB2).
# Copy this to your working directory as config.yaml and edit accordingly.

# Text file with two columns: "filename" and "date"
# filename: path to a 3-column text file (wl[AA], flux, sigma)
# date: observation date (BJD_TDB)
spectra_list: spectra_list.txt

# SB2 model (double-lined)
model: SB2

# Optionally restrict analysis to a wavelength window [Angstroms]
# wl_min: 5260.0
# wl_max: 5280.0

# Maximum number of epochs to load (null = load all)
epoch_limit: ~

# Noise softening factor applied to sigma before GP fitting
soften: 1.0

# Barycentric velocity correction (Earth's motion relative to Solar System
# barycenter).  Set to true if the input spectra are already corrected for
# this effect; set to false to have PSOAP compute and apply the correction
# automatically as a preprocessing step.
# When barycentric_corrected is false, target_ra and target_dec (ICRS,
# decimal degrees) are required.
barycentric_corrected: true
# target_ra: 26.021   # Right Ascension [degrees], e.g. Tau Ceti
# target_dec: -15.939  # Declination [degrees]

# Orbital and GP starting parameters
parameters:
  q: 0.2          # mass ratio q = M_B / M_A
  K: 1.0          # semi-amplitude of primary [km/s]
  e: 0.0          # eccentricity
  omega: 0.0      # argument of periastron [deg]
  P: 10.0         # orbital period [days]
  T0: 0.0         # epoch of periastron passage [JD]
  gamma: 0.0      # systemic velocity [km/s]
  amp_f: 0.5      # GP amplitude of primary [flux]
  l_f: 5.0        # GP length scale of primary [km/s]
  amp_g: 0.5      # GP amplitude of secondary [flux]
  l_g: 5.0        # GP length scale of secondary [km/s]

# Step sizes for the MH proposal
jumps:
  q: 0.01
  K: 0.2
  e: 0.02
  omega: 0.01
  P: 0.01
  T0: 0.01
  gamma: 0.01
  amp_f: 0.05
  l_f: 0.5
  amp_g: 0.05
  l_g: 0.5

# Parameters held fixed during sampling
fix_params: ["gamma"]

# Number of MCMC steps
samples: 1000

# Random seed for reproducibility (null = unseeded)
seed: ~

# Path to optimised jump covariance matrix (optional)
opt_jump: opt_jump.npy

# Output directory
outdir: output
