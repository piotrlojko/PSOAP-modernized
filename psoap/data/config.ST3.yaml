### PSOAP configuration file for a triple-lined tertiary system (ST3).
### ST2 (double-lined tertiary) uses the same parameter structure as SB2;
### use config.SB2.yaml as the starting point for ST2.

### Text file with two columns: "filename" and "date"
spectra_list: spectra_list.txt

### ST3 model (triple-lined: A+B pair orbited by C)
model: ST3

# wl_min: ~
# wl_max: ~

epoch_limit: ~
soften: 1.0

### Barycentric velocity correction.  Set to true if spectra are already
### corrected; set to false to apply the correction automatically.
### When barycentric_corrected is false, target_ra and target_dec (ICRS,
### decimal degrees) are required.
barycentric_corrected: true
# target_ra: 83.822
# target_dec: -5.391

parameters:
  q_in: 0.4       # mass ratio of inner pair q_in = M_B / M_A
  K_in: 10.0      # semi-amplitude of inner primary [km/s]
  e_in: 0.0
  omega_in: 0.0
  P_in: 3.0
  T0_in: 0.0
  q_out: 0.2      # mass ratio of outer companion
  K_out: 4.0
  e_out: 0.0
  omega_out: 0.0
  P_out: 30.0
  T0_out: 0.0
  gamma: 0.0
  amp_f: 0.5
  l_f: 5.0
  amp_g: 0.5
  l_g: 5.0
  amp_h: 0.5
  l_h: 5.0

jumps:
  q_in: 0.01
  K_in: 0.2
  e_in: 0.02
  omega_in: 0.01
  P_in: 0.01
  T0_in: 0.01
  q_out: 0.01
  K_out: 0.1
  e_out: 0.02
  omega_out: 0.01
  P_out: 0.1
  T0_out: 0.1
  gamma: 0.01
  amp_f: 0.05
  l_f: 0.5
  amp_g: 0.05
  l_g: 0.5
  amp_h: 0.05
  l_h: 0.5

fix_params: ["gamma"]
samples: 1000
seed: ~
opt_jump: opt_jump.npy
outdir: output

### Automatic wavelength chunking (optional).
### When enabled, PSOAP inspects the loaded spectra and available system memory
### to automatically split the wavelength range into sub-chunks such that each
### worker's dense NxN covariance matrix fits in RAM.  Leave disabled (or omit
### this section entirely) to use the existing wl_ranges list instead.
# auto_chunk:
#   enabled: false        # set to true to activate automatic chunking
#   memory_fraction: 0.25 # fraction of available RAM to budget per worker
#   safety_factor: 4.0    # multiplier on raw N^2 memory estimate (headroom)
#   max_chunks: ~         # hard cap on number of chunks (null = no cap)
#   max_wallclock_hours: 48.0  # abort if estimated runtime exceeds this


### Spectral resolution degradation (optional preprocessing).
### When enabled, each loaded chunk is linearly interpolated onto a sparser
### wavelength grid before GP fitting.  This reduces N and therefore both the
### memory footprint and the compute cost.  Use this when auto-chunking alone
### cannot reduce chunk sizes to a manageable level.
### Provide exactly one of target_step or factor.
# resolution_degrade:
#   enabled: false           # set to true to activate degradation
#   target_step: ~           # target uniform wavelength spacing [Angstroms]
#   factor: ~                # integer down-sampling factor (interpolate flux onto k-times sparser wl grid)
#   apply_before_chunking: true  # degrade before auto-chunk planning
